<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: #e8eef5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            width: min(340px, calc(100% - 32px));
            box-shadow: 0 5px 20px #0002;
            text-align: center;
        }
        h2 { margin-top: 0; color: #1f2937; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-align: right;
            font-family: Tahoma, sans-serif;
            font-size: 14px;
        }
        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            font-size: 15px;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main class="login-box">
        <h2>ورود به حساب</h2>
        <form id="login-form">
            <input type="text" name="username" placeholder="نام کاربری" aria-label="نام کاربری" required>
            <input type="password" name="password" placeholder="رمز عبور" aria-label="رمز عبور" required>
            <button type="submit">ورود</button>
        </form>
    </main>
    <script>
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            alert("فرم ارسال شد! این صفحه فعلاً آزمایشی است و ورود واقعی انجام نمی‌دهد.");
        });
    </script>
</body>
</html>
